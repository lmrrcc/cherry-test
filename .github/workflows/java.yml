name: Java

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
  pull_request:
    branches: [main]
    paths:
      - "java/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
      - name: Build, test and check formatting
        working-directory: java
        run: ./mvnw -B verify

  golden-vectors:
    name: Golden vectors match the Rust oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Regenerate vectors from Rust std and serde_json
        run: cargo run --quiet --release --locked --manifest-path java/parity/vectors-rs/Cargo.toml -- "$RUNNER_TEMP/vectors"
      - name: Committed vectors are up to date
        run: diff -r "$RUNNER_TEMP/vectors" java/cherry-test-common/src/test/resources/vectors
