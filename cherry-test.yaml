defaults:
  diff_base: main
  coverage: false
  html_report: false
  open_report: true
  runs_base: target/cherry-test/runs
  scope: global
  code_review: false

projects:
  cherry-test:
    path: .
    packages:
      cherry-test:
        kinds: [unit]
        manifest: test/cherry-test/Cargo.toml
      cherry-test-core:
        kinds: [unit]
        manifest: test/cherry-test-core/Cargo.toml
      cherry-test-common:
        kinds: [unit]
        manifest: test/cherry-test-common/Cargo.toml
      cherry-test-macros:
        kinds: [unit]
        manifest: test/cherry-test-macros/Cargo.toml

  mini_discord:
    path: mini/mini-discord
    packages:
      mini-discord:
        adapter: maven
        manifest: mini/mini-discord/pom.xml
        kinds: [unit, integration]
        unit:
          args: [-o, -Dmini.discord.isolated=true]
        integration:
          scope: none
          args: [-o, -Dmini.discord.isolated=true]
