[package]
name = "cherry-test-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cherry-test integration runtime"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
cherry-test-common = { version = "0.3.7", path = "../cherry-test-common" }
cherry-test-macros = { version = "0.3.7", path = "../cherry-test-macros" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
