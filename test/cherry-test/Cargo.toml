[package]
name = "cherry-test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cherry-test: workspace tests, coverage and browser reports"
build = "build.rs"
autobins = false

[[bin]]
name = "cherry-test"
path = "src/main.rs"

[[bin]]
name = "cargo-cherry-test"
path = "src/bin/cargo-cherry-test.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
cherry-test-common = { version = "0.3.7", path = "../cherry-test-common" }
cherry-test-core = { version = "0.3.7", path = "../cherry-test-core" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
